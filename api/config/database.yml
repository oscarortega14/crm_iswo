# PostgreSQL. Versions 9.5 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # No producción: 3 bases (primary/queue/cache) comparten este pool por proceso.
  # 20 dejaba hasta 60 conexiones por proceso sin tope de max_connections en Postgres
  # (server + console + specs en paralelo agotaban el default de 100). 10 alcanza
  # de sobra los 8 threads de Puma en dev (ver config/puma.rb) con margen para consola/rake.
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { ENV.fetch("RAILS_ENV", "development") == "production" ? 5 : 10 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("DB_USERNAME", "postgres") %>
  password: <%= ENV.fetch("DB_PASSWORD", "postgres") %>

# Dev/test: queue y cache apuntan a la MISMA base que primary (las tablas solid_*
# viven en schema.rb). `database_tasks: false` evita que db:migrate/db:schema:load
# dumpeen/carguen queue_schema.rb y cache_schema.rb sobre esa base compartida
# (esos archivos son para las bases separadas de producción).
development:
  primary: &primary_development
    <<: *default
    database: crm_iswo_development
  queue:
    <<: *primary_development
    migrations_paths: db/queue_migrate
    database_tasks: false
  cache:
    <<: *primary_development
    migrations_paths: db/cache_migrate
    database_tasks: false

test:
  primary: &primary_test
    <<: *default
    database: crm_iswo_test
  queue:
    <<: *primary_test
    migrations_paths: db/queue_migrate
    database_tasks: false
  cache:
    <<: *primary_test
    migrations_paths: db/cache_migrate
    database_tasks: false

# As with config/credentials.yml, you never want to store sensitive information,
# like your database password, in your source code. If your source code is
# ever seen by anyone, they now have access to your database.
#
# Instead, provide the password or a full connection URL as an environment
# variable when you boot the app. For example:
#
#   DATABASE_URL="postgres://myuser:mypass@localhost/somedatabase"
#
# If the connection URL is provided in the special DATABASE_URL environment
# variable, Rails will automatically merge its configuration values on top of
# the values provided in this file. Alternatively, you can specify a connection
# URL environment variable explicitly:
#
#   production:
#     url: <%= ENV["MY_APP_DATABASE_URL"] %>
#
# Connection URLs for non-primary databases can also be configured using
# environment variables. The variable name is formed by concatenating the
# connection name with `_DATABASE_URL`. For example:
#
#   CACHE_DATABASE_URL="postgres://cacheuser:cachepass@localhost/cachedatabase"
#
# Read https://guides.rubyonrails.org/configuring.html#configuring-a-database
# for a full overview on how database connection configuration can be specified.
#
# Fase 1 seguridad — tránsito app↔PostgreSQL (Opción 1 infra).
# Producción: DB_SSLMODE=require (default). Dev/test: omitir o DB_SSLMODE=disable.
production:
  primary: &primary_production
    <<: *default
    database: crm_iswo_production
    username: crm_iswo
    password: <%= ENV["CRM_ISWO_DATABASE_PASSWORD"] %>
    sslmode: <%= ENV.fetch("DB_SSLMODE", "require") %>
  cache:
    <<: *primary_production
    database: crm_iswo_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: crm_iswo_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: crm_iswo_production_cable
    migrations_paths: db/cable_migrate

# Solid Queue — tareas recurrentes (RFC §6.4 recordatorios, integraciones, mantenimiento).
# Requiere tablas solid_queue_* (bundle exec rails solid:setup) y worker activo.

shared: &shared
  reminder_notification_job:
    class: ReminderNotificationJob
    queue: critical
    schedule: every minute

  reminder_upcoming_notification_job:
    class: ReminderUpcomingNotificationJob
    queue: critical
    schedule: every minute

  ad_sync_job:
    class: AdSyncJob
    queue: integrations
    schedule: every 15 minutes

  cleanup_exports_job:
    class: CleanupExportsJob
    queue: low
    schedule: at 3am every day

  refresh_duplicate_cache_job:
    class: RefreshDuplicateCacheJob
    queue: low
    schedule: at 4am every day

  daily_briefing_job:
    class: DailyBriefingJob
    queue: low
    schedule: at 7am every day

  whatsapp_campaign_batch_job:
    class: WhatsappCampaignBatchJob
    queue: integrations
    schedule: every 5 minutes

development:
  <<: *shared

production:
  <<: *shared
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
